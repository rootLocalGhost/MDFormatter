<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/monokai-sublime.min.css">
    
  <!-- KaTeX CSS for rendering Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <style>
    :root {
      --bg: #2D2A2E;
      --sidebar: #403E41;
      --accent-red: #FF6188;
      --accent-orange: #FC9867;
      --accent-yellow: #FFD866;
      --accent-green: #A9DC76;
      --accent-blue: #78DCE8;
      --accent-purple: #AB9DF2;
      --text-main: #FCFCFA;
      --text-dim: #939293;
      --border: rgba(255, 255, 255, 0.1);
      --font-ui: 'Poppins', 'Hind Siliguri', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --radius: 8px;
      --anim-speed: 0.2s;
    }

    @font-face {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: 400;
      src: url(https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/4.0.0/font/MaterialIcons-Regular.ttf) format('truetype');
    }

    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      vertical-align: middle;
    }

    * {
      box-sizing: border-box;
      outline: none;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--sidebar);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    header {
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      z-index: 10;
    }

    .brand {
      font-weight: 600;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-yellow);
    }

    .brand .material-icons {
      color: var(--accent-red);
      font-size: 24px;
    }

    .document-name {
      display: flex;
      flex: 1 1 240px;
      flex-direction: column;
      gap: 2px;
      max-width: 320px;
      min-width: 190px;
    }

    .document-name label {
      padding-left: 2px;
      color: var(--text-dim);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .document-name input {
      width: 100%;
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      font-family: var(--font-ui);
      font-size: 12px;
      transition: border-color var(--anim-speed) ease, background var(--anim-speed) ease;
    }

    .document-name input::placeholder {
      color: var(--text-dim);
    }

    .document-name input:focus {
      border-color: var(--accent-blue);
      background: rgba(0, 0, 0, 0.28);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--sidebar);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: 13px;
      cursor: pointer;
      transition: all var(--anim-speed) ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn .material-icons {
      font-size: 16px;
    }

    .export-html-btn {
      gap: 4px;
      padding-right: 9px;
      padding-left: 9px;
    }

    .export-html-icon {
      display: block;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--accent-blue);
      color: var(--bg);
      border-color: var(--accent-blue);
      font-weight: 600;
    }

    .btn.primary:hover {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    .btn.danger:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .editor-status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
    }

    .editor-status span:last-child {
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 60px);
    }

    .editor-container {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #221F22;
    }

    textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 20px;
      font-family: var(--font-code);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }

    textarea::placeholder {
      color: var(--text-dim);
      opacity: 0.5;
    }

    .preview-container {
      padding: 20px 40px;
      overflow-y: auto;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.7;
      font-size: 15px;
      background-color: var(--bg);
    }

    /* Math specific styling */
    .markdown-body .katex {
      font-size: 1.15em;
    }

    /* Mermaid diagrams specific styling */
    .mermaid {
      background: rgba(255, 255, 255, 0.03);
      padding: 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin: 1.5em 0;
      text-align: center;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      color: var(--accent-green);
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .markdown-body h1 {
      font-size: 2em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3em;
    }

    .markdown-body h2 {
      font-size: 1.5em;
    }

    .markdown-body p {
      margin-bottom: 1em;
      color: #fcfcfa;
    }

    .markdown-body a {
      color: var(--accent-blue);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent-blue);
    }

    .markdown-body a:hover {
      border-bottom-style: solid;
    }

    .markdown-body strong {
      color: var(--accent-red);
    }

    .markdown-body em {
      color: var(--accent-orange);
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-purple);
      margin: 1em 0;
      padding-left: 1em;
      color: var(--text-dim);
      font-style: italic;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 20px;
    }

    .markdown-body li {
      margin-bottom: 5px;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .markdown-body code:not(pre code) {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-code);
      font-size: 0.9em;
      color: var(--accent-orange);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
    }

    .markdown-body th {
      background: var(--sidebar);
      color: var(--accent-yellow);
    }

    .code-wrapper {
      background: #191919;
      border-radius: var(--radius);
      margin: 1.5em 0;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s;
    }

    .code-wrapper:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-ui);
      user-select: none;
    }

    .lang-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-blue);
    }

    .code-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }

    .action-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .action-btn.active {
      color: var(--accent-green);
    }

    pre {
      margin: 0;
      padding: 0;
    }

    code.hljs {
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.5;
      padding: 15px !important;
      background: transparent !important;
      overflow-x: auto;
    }

    .code-wrapper.collapsed .hljs {
      display: none;
    }

    .code-wrapper.collapsed {
      border-bottom: 1px solid var(--border);
    }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-green);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    #toast.error {
      background: var(--accent-red);
      color: var(--text-main);
    }

    @media (max-width: 900px) {
      header {
        height: auto;
        min-height: 60px;
        flex-wrap: wrap;
        padding: 8px 16px;
        row-gap: 6px;
      }
      .brand {
        order: 1;
      }
      .controls {
        order: 2;
        margin-left: auto;
      }
      .document-name {
        order: 3;
        flex: 1 0 100%;
        max-width: none;
        min-width: 0;
      }
      main {
        height: auto;
        min-height: 0;
      }
    }

    @media (max-width: 768px) {
      header {
        height: auto;
        min-height: 60px;
        padding: 8px 12px;
        gap: 6px;
      }
      .controls {
        gap: 4px;
      }
      .controls .btn {
        padding: 6px 8px;
      }
      .controls .btn.export-html-btn {
        padding-right: 7px;
        padding-left: 7px;
      }
      .controls .btn .btn-label {
        display: none;
      }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .editor-container {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .preview-container {
        padding: 15px;
      }
      .brand span:not(.material-icons) {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="animate__animated animate__fadeInDown">
    <div class="brand">
      <span class="material-icons">code</span>
      <span>Markdown Studio</span>
    </div>
    
    <div class="document-name">
      <label for="docTitle">Document name</label>
      <input type="text" id="docTitle" placeholder="Enter a document name" value="My_Document" aria-describedby="documentNameHint">
      <span id="documentNameHint" class="visually-hidden">Used as the filename for exported documents.</span>
    </div>

    <div class="controls">
      <button class="btn danger" id="clearBtn" title="Clear input" aria-label="Clear input"><span class="material-icons">delete</span></button>
      <button class="btn" id="exportPdfBtn" title="Export as PDF" aria-label="Export as PDF"><span class="material-icons">picture_as_pdf</span><span class="btn-label">PDF</span></button>
      <button class="btn export-html-btn" id="exportHtmlBtn" title="Export as HTML" aria-label="Export as HTML"><svg class="export-html-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 16 4 12l4-4 1.4 1.4L6.8 12l2.6 2.6L8 16Zm8 0-1.4-1.4 2.6-2.6-2.6-2.6L16 8l4 4-4 4Zm-2-12-3.5 16h-2L12 4h2Z"/></svg><span class="btn-label">HTML</span></button>
      <button class="btn" id="exportTxtBtn" title="Export as plain text" aria-label="Export as plain text"><span class="material-icons">text_snippet</span><span class="btn-label">TXT</span></button>
      <button class="btn" id="exportDocxBtn" title="Export as Word document" aria-label="Export as Word document"><span class="material-icons">description</span><span class="btn-label">DOCX</span></button>
      <button class="btn" id="exportMdBtn" title="Download Markdown source" aria-label="Download Markdown source"><span class="material-icons">code</span><span class="btn-label">MD</span></button>
    </div>
  </header>

  <main class="animate__animated animate__fadeIn">
    <div class="editor-container">
      <textarea id="input" placeholder="Paste your messy Markdown or AI response here..." aria-label="Markdown editor" spellcheck="false"></textarea>
      <div class="editor-status" aria-live="polite">
        <span id="documentStats">0 words · 0 characters</span>
        <span id="saveStatus">Ready</span>
      </div>
    </div>

    <div class="preview-container">
      <div id="output" class="markdown-body"></div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"><span class="material-icons">check_circle</span><span data-toast-message>Copied to clipboard!</span></div>

  <!-- Core Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  
  <!-- Math Support: KaTeX (Removed marked-katex-extension in favor of custom engine) -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Diagram Support: Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

  <!-- PDF Support: html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- DOCX Support -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const toastEl = document.getElementById('toast');
    const toastMessageEl = toastEl.querySelector('[data-toast-message]');
    const docTitleInput = document.getElementById('docTitle');
    const documentStatsEl = document.getElementById('documentStats');
    const saveStatusEl = document.getElementById('saveStatus');
    const draftStorageKey = 'markdown-studio-draft';
    let toastTimeout;

    // Initialize Diagram Config
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    // Initialize Marked options
    marked.setOptions({
      breaks: true,
      gfm: true,
    });
    
    // --- Custom Math Parsers (Fixes the broken block math bug) ---
    const blockMath = {
      name: 'blockMath',
      level: 'block',
      start(src) { return src.indexOf('$$'); },
      tokenizer(src) {
        // Matches $$ multiline blocks perfectly
        const match = /^\$\$([\s\S]+?)\$\$/.exec(src);
        if (match) {
          return {
            type: 'blockMath',
            raw: match[0],
            text: match[1].trim()
          };
        }
      },
      renderer(token) {
        try {
          return `<div class="katex-block" style="text-align: center; margin: 1.5em 0; overflow-x: auto;">` +
            katex.renderToString(token.text, { displayMode: true, throwOnError: false }) +
            `</div>`;
        } catch (e) { return `<div style="color:red">Math Error</div>`; }
      }
    };

    const inlineBlockMath = {
      name: 'inlineBlockMath',
      level: 'inline',
      start(src) { return src.indexOf('$$'); },
      tokenizer(src) {
        // Fallback for $$ blocks embedded inside paragraphs
        const match = /^\$\$([\s\S]+?)\$\$/.exec(src);
        if (match) {
          return {
            type: 'inlineBlockMath',
            raw: match[0],
            text: match[1].trim()
          };
        }
      },
      renderer(token) {
        return `<span class="katex-block">` +
          katex.renderToString(token.text, { displayMode: true, throwOnError: false }) +
          `</span>`;
      }
    };

    const inlineMath = {
      name: 'inlineMath',
      level: 'inline',
      start(src) { return src.indexOf('$'); },
      tokenizer(src) {
        // Matches $...$ without breaking when isolated $ symbols exist
        const match = /^\$([^\s$](?:[^$]*?[^\s$])?)\$/.exec(src);
        if (match) {
          return {
            type: 'inlineMath',
            raw: match[0],
            text: match[1].trim()
          };
        }
      },
      renderer(token) {
        return katex.renderToString(token.text, { displayMode: false, throwOnError: false });
      }
    };

    // Inject our bulletproof math engine into Marked
    marked.use({ extensions: [blockMath, inlineBlockMath, inlineMath] });

    function debounce(func, wait) {
      let timeout;
      const debounced = function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
      debounced.cancel = () => {
        clearTimeout(timeout);
        timeout = null;
      };
      return debounced;
    }

    async function render() {
      const rawMarkdown = inputEl.value;
      const html = marked.parse(rawMarkdown);
      outputEl.innerHTML = html;
      updateDocumentStats(rawMarkdown);
      await postProcess();
      lastRenderedMarkdown = rawMarkdown;
    }

    let lastRenderedMarkdown = null;
    const renderDebounced = debounce(render, 300);

    async function ensureRendered() {
      if (lastRenderedMarkdown !== inputEl.value) {
        renderDebounced.cancel();
        await render();
      }
    }

    function updateDocumentStats(text) {
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      documentStatsEl.textContent = `${words.toLocaleString()} words · ${text.length.toLocaleString()} characters`;
    }

    function saveDraft() {
      try {
        localStorage.setItem(draftStorageKey, JSON.stringify({
          markdown: inputEl.value,
          title: docTitleInput.value
        }));
        saveStatusEl.textContent = 'Saved locally';
      } catch (error) {
        console.error('Unable to save draft locally:', error);
        saveStatusEl.textContent = 'Local save unavailable';
      }
    }

    function restoreDraft() {
      try {
        const savedDraft = localStorage.getItem(draftStorageKey);
        if (!savedDraft) return false;
        const draft = JSON.parse(savedDraft);
        if (typeof draft.markdown !== 'string' || typeof draft.title !== 'string') return false;
        inputEl.value = draft.markdown;
        docTitleInput.value = draft.title;
        return true;
      } catch (error) {
        console.error('Unable to restore saved draft:', error);
        saveStatusEl.textContent = 'Unable to restore draft';
        return false;
      }
    }

    async function postProcess() {
      // 1. Handle Mermaid Diagrams First
      const codeBlocks = Array.from(outputEl.querySelectorAll('pre code'));
      
      const mermaidBlocks = codeBlocks.filter(block => 
        Array.from(block.classList).some(cls => cls === 'language-mermaid')
      );

      mermaidBlocks.forEach((block) => {
        const pre = block.parentElement;
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = block.textContent;
        pre.parentNode.replaceChild(mermaidDiv, pre);
      });

      try {
        if (mermaidBlocks.length > 0) {
          await mermaid.run({ nodes: outputEl.querySelectorAll('.mermaid') });
        }
      } catch (err) {
        console.error("Mermaid parsing error:", err);
      }

      // 2. Handle Syntax Highlighting for remaining code blocks
      const remainingBlocks = outputEl.querySelectorAll('pre code');
      remainingBlocks.forEach((block) => {
        if(block.parentElement.parentElement.classList.contains('code-wrapper')) return;

        hljs.highlightElement(block);

        let lang = 'Text';
        block.classList.forEach(cls => {
          if (cls.startsWith('language-')) {
            lang = cls.replace('language-', '');
          }
        });

        const pre = block.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper animate__animated animate__fadeIn';

        const header = document.createElement('div');
        header.className = 'code-header';

        const langLabel = document.createElement('div');
        langLabel.className = 'lang-tag';
        langLabel.textContent = lang;
        const actions = document.createElement('div');
        actions.className = 'code-actions';
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'action-btn toggle-btn';
        toggleBtn.title = 'Collapse';
        toggleBtn.innerHTML = '<span class="material-icons">expand_more</span>';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn copy-btn';
        copyBtn.title = 'Copy Code';
        copyBtn.innerHTML = '<span class="material-icons">content_copy</span> Copy';
        actions.append(toggleBtn, copyBtn);
        header.append(langLabel, actions);

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);

        const toggleIcon = toggleBtn.querySelector('.material-icons');

        copyBtn.addEventListener('click', () => {
          copyToClipboard(block.innerText);
          copyBtn.innerHTML = '<span class="material-icons">check</span> Copied';
          copyBtn.classList.add('active');
          setTimeout(() => {
            copyBtn.innerHTML = '<span class="material-icons">content_copy</span> Copy';
            copyBtn.classList.remove('active');
          }, 2000);
        });

        toggleBtn.addEventListener('click', () => {
          wrapper.classList.toggle('collapsed');
          if (wrapper.classList.contains('collapsed')) {
            toggleIcon.textContent = 'chevron_right';
          } else {
            toggleIcon.textContent = 'expand_more';
          }
        });
      });

      outputEl.querySelectorAll('a').forEach(a => a.target = '_blank');
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast();
      } catch (err) {
        console.error('Failed to copy!', err);
        showToast('Could not copy to clipboard.', true);
      }
    }

    function showToast(message = 'Copied to clipboard!', isError = false) {
      toastMessageEl.textContent = message;
      toastEl.querySelector('.material-icons').textContent = isError ? 'error' : 'check_circle';
      toastEl.classList.toggle('error', isError);
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    function getSafeFileName(extension) {
      const title = docTitleInput.value.trim().normalize('NFKD');
      const safeTitle = title
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9_-]+/gi, '_')
        .replace(/^_+|_+$/g, '') || 'Untitled_Document';
      return `${safeTitle}.${extension}`;
    }

    function downloadFile(content, type, extension) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = getSafeFileName(extension);
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm("Clear everything?")) {
        inputEl.value = '';
        saveDraft();
        render();
      }
    });

    function prepareExportContent() {
      const content = outputEl.cloneNode(true);
      content.querySelectorAll('.code-actions').forEach(actions => actions.remove());
      content.querySelectorAll('.code-wrapper').forEach(wrapper => wrapper.classList.remove('collapsed'));
      content.querySelectorAll('[class*="animate__"]').forEach(element => {
        element.className = Array.from(element.classList)
          .filter(className => !className.startsWith('animate__'))
          .join(' ');
      });
      return content;
    }

        const exportRoot = document.createElement('div');
        exportRoot.id = 'pdfExportRoot';
        exportRoot.className = 'markdown-body';
        exportRoot.appendChild(prepareExportContent());
        exportRoot.style.cssText = 'position:fixed;left:-10000px;top:0;width:760px;padding:24px;background:#fff;color:#202124;z-index:-1;';

        const exportStyles = document.createElement('style');

          #pdfExportRoot p, #pdfExportRoot li, #pdfExportRoot blockquote { color: #202124; }

            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
            pagebreak: { mode: ['css', 'legacy'], avoid: ['pre', 'table', 'img', '.katex-block'] }

      } catch (error) {
        console.error('PDF export failed:', error);
        showToast(error.message || 'PDF export failed.', true);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('exportHtmlBtn').addEventListener('click', async () => {

      })[character]);

    document.getElementById('exportTxtBtn').addEventListener('click', async () => {
      await ensureRendered();
      const exportContent = prepareExportContent();
      exportContent.style.cssText = 'position:fixed;left:-10000px;top:0;';
      document.body.appendChild(exportContent);
      let plainText;
      try {
        plainText = (exportContent.innerText || exportContent.textContent || '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      } finally {
        exportContent.remove();

      downloadFile(plainText ? `${plainText}\n` : '', 'text/plain;charset=utf-8', 'txt');

    document.getElementById('exportMdBtn').addEventListener('click', () => {
      downloadFile(inputEl.value, 'text/markdown;charset=utf-8', 'md');
      showToast('Markdown source downloaded.');
    });

    function inlineRuns(tokens, inherited = {}) {
      const { TextRun } = docx;
      const runs = [];
      (tokens || []).forEach(token => {
        const options = { ...inherited };
        if (token.type === 'strong') options.bold = true;
        if (token.type === 'em') options.italics = true;
        if (token.type === 'del') options.strike = true;
        if (token.type === 'link') {
          options.color = '0563C1';
          options.underline = {};
        }
        if (token.type === 'codespan') {
          options.font = 'Consolas';
          options.shading = { fill: 'EEEEEE' };
        }
        if (token.type === 'br') {
          runs.push(new TextRun({ text: '', break: 1 }));
        } else if (token.tokens?.length) {
          runs.push(...inlineRuns(token.tokens, options));
        } else {
          const text = token.text ?? token.raw ?? '';
          if (text) runs.push(new TextRun({ text: text.replace(/<[^>]*>/g, ''), ...options }));
        }
      });
      return runs.length ? runs : [new TextRun('')];
    }

    function docxBlocks(tokens, depth = 0) {
      const { Paragraph, Table, TableRow, TableCell, HeadingLevel, WidthType, ShadingType } = docx;
      const blocks = [];
      (tokens || []).forEach(token => {
        if (token.type === 'space' || token.type === 'def') return;
        if (token.type === 'heading') {
          const heading = [HeadingLevel.HEADING_1, HeadingLevel.HEADING_2, HeadingLevel.HEADING_3,
            HeadingLevel.HEADING_4, HeadingLevel.HEADING_5, HeadingLevel.HEADING_6][token.depth - 1];
          blocks.push(new Paragraph({ heading: heading || HeadingLevel.HEADING_1, children: inlineRuns(token.tokens) }));
        } else if (token.type === 'paragraph' || token.type === 'text') {
          blocks.push(new Paragraph({ children: inlineRuns(token.tokens || [{ text: token.text || '' }]) }));
        } else if (token.type === 'blockquote') {
          (token.tokens || []).forEach(child => {
            if (child.type === 'paragraph' || child.type === 'text') {
              blocks.push(new Paragraph({
                children: inlineRuns(child.tokens || [{ text: child.text || '' }]),
                indent: { left: 360 },
                style: 'Quote'
              }));
            } else {
              blocks.push(...docxBlocks([child], depth));
            }
          });
        } else if (token.type === 'code') {
          const codeRuns = (token.text || '').split('\n').map((line, index) => {
            const run = { text: line, font: 'Consolas', size: 18 };
            if (index < token.text.split('\n').length - 1) run.break = 1;
            return new docx.TextRun(run);
          });
          blocks.push(new Paragraph({ children: codeRuns, shading: { type: ShadingType.CLEAR, fill: 'F1F3F5' }, spacing: { before: 120, after: 120 } }));
        } else if (token.type === 'list') {
          token.items.forEach(item => {
            const nested = (item.tokens || []).filter(child => child.type === 'list');
            const inline = (item.tokens || []).filter(child => child.type !== 'list' && child.type !== 'space');
            const runs = inline.flatMap(child => child.tokens?.length ? inlineRuns(child.tokens) : inlineRuns([{ text: child.text || '' }]));
            if (item.task) runs.unshift(new docx.TextRun({ text: item.checked ? '[x] ' : '[ ] ' }));
            const paragraphOptions = token.ordered
              ? { numbering: { reference: 'markdown-numbers', level: Math.min(depth, 4) } }
              : { bullet: { indent: 360 + depth * 360 } };
            blocks.push(new Paragraph({ children: runs, ...paragraphOptions }));
            nested.forEach(child => blocks.push(...docxBlocks([child], depth + 1)));
          });
        } else if (token.type === 'table') {
          const rows = [token.header, ...(token.rows || [])].map((row, rowIndex) =>
            new TableRow({
              children: row.map(cell => new TableCell({
                width: { size: Math.floor(100 / row.length), type: WidthType.PERCENTAGE },
                shading: rowIndex === 0 ? { type: ShadingType.CLEAR, fill: 'E8EEF7' } : undefined,
                children: [new Paragraph({ children: inlineRuns(cell.tokens || [{ text: cell.text || '' }]) })]
              }))
            })
          );
          blocks.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows }));
        } else if (token.type === 'hr') {
          blocks.push(new Paragraph({ text: '', border: { bottom: { color: '999999', style: 'single', size: 4 } } }));
        } else if (token.type === 'html') {
          const text = (token.text || '').replace(/<[^>]*>/g, ' ').trim();
          if (text) blocks.push(new Paragraph({ text }));
        }
      });
      return blocks;
    }

    document.getElementById('exportDocxBtn').addEventListener('click', async () => {
      const button = document.getElementById('exportDocxBtn');
      button.disabled = true;
      try {
        if (!window.docx) throw new Error('The Word export library did not load.');
        const paragraphs = docxBlocks(marked.lexer(inputEl.value));
        const doc = new docx.Document({
          numbering: {
            config: [{
              reference: 'markdown-numbers',
              levels: Array.from({ length: 5 }, (_, level) => ({
                level,
                format: 'decimal',
                text: `%${level + 1}.`,
                alignment: 'left',
                style: { paragraph: { indent: { left: 720 + level * 360, hanging: 260 } } }
              }))
            }]
          },
          sections: [{
            properties: {},
            children: [
              new docx.Paragraph({
                children: [new docx.TextRun({ text: docTitleInput.value.trim() || 'Markdown Export', bold: true, size: 36 })],
                spacing: { after: 300 }
              }),
              ...(paragraphs.length ? paragraphs : [new docx.Paragraph('')])
            ]
          }]
        });
        const blob = await docx.Packer.toBlob(doc);
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = getSafeFileName('docx');
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('Word document exported successfully.');
      } catch (error) {
        console.error('DOCX export failed:', error);
        showToast(error.message || 'DOCX export failed.', true);
      } finally {
        button.disabled = false;
      }
    });

    const saveDraftDebounced = debounce(saveDraft, 400);
    inputEl.addEventListener('input', () => {
      updateDocumentStats(inputEl.value);
      renderDebounced();
      saveDraftDebounced();
    });
    docTitleInput.addEventListener('input', saveDraftDebounced);
